name: Daily barcode database update

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 05:00 Dubai
  workflow_dispatch:
    inputs:
      sources:
        description: "Force only these sources (comma list, empty = normal run). e.g. openfacts or usda,wikidata"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: barcode-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update database
        env:
          EAN_SEARCH_TOKEN: ${{ secrets.EAN_SEARCH_TOKEN }}
          GO_UPC_KEY: ${{ secrets.GO_UPC_KEY }}
          BARCODELOOKUP_KEY: ${{ secrets.BARCODELOOKUP_KEY }}
        run: |
          if [ -n "${{ inputs.sources }}" ]; then
            python update_db.py --sources "${{ inputs.sources }}"
          else
            python update_db.py
          fi

      - name: Commit changes (runs even if the update step failed or timed out)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          rm -f data/*.tmp meta/*.tmp state.tmp
          git add -A data meta inbox state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Barcode DB update $(date -u +%F)"
          git pull --rebase
          git push
